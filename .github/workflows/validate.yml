name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate every fighter
        run: node bin/jev-arena.js validate
      - name: Smoke-fight new or changed fighters against the field (offline mock brain, no key needed)
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- fighters/ | grep -E '\.ya?ml$' || true)
          if [ -z "$changed" ]; then echo "No fighter changes."; exit 0; fi
          for f in $changed; do
            for opp in fighters/*.yaml; do
              [ "$f" = "$opp" ] && continue
              node bin/jev-arena.js fight "$f" "$opp" --brain instant --mode lockstep --quiet
            done
          done
