# Example entry for Jev Arena Season 1. Copy this file, rename it to
# fighters/<your-github-handle>.yaml, and make it your own.

name: Counterpunch          # up to 24 characters, must be unique on the ladder
author: Eliot5566           # your GitHub handle
tagline: Let them swing first.
color: "#2dd4bf"            # any "#rrggbb" color

# The part that matters: plain English, up to 700 characters.
# Describe situations the brain can see, not coordinates.
strategy: >
  I fight at medium range and let the enemy commit first. When a heavy shot is charging,
  I strafe out of its line, then punish with bolts while the enemy recovers. If the enemy
  rushes in, I shield the first punch and answer with melee. I take cover only to recharge,
  and when the zone starts closing I move to the center early instead of getting caught outside.

# Optional notes on single moves, up to 160 characters each.
actions:
  melee: Only right after blocking a punch, or when the enemy is stunned.
  charge: Only when the enemy is stunned or standing still.

# Optional yes/no checks (up to 4). When Jev is at least `threshold` sure the
# sentence is true, the move fires immediately, overriding the strategy.
reflexes:
  - when: A heavy shot is flying at me and will hit within half a second.
    do: dash
    threshold: 0.7
  - when: The enemy is in melee range and about to punch me.
    do: shield
    threshold: 0.75

fallback: strafe_left       # movement used when the brain is unsure
min_confidence: 0.25        # below this confidence, use the fallback instead
